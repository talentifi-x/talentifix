name: Publish ML hiring guide

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the article and links without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-ml-hiring-guide
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate content and existing link destinations
        run: node scripts/upload-blog-machine-learning-engineer-india.mjs --dry-run --check-links
      - name: Publish guide and reciprocal article link
        if: ${{ !inputs.dry_run }}
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: node scripts/upload-blog-machine-learning-engineer-india.mjs --publish
